name: dada-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DADA_POSTGRES_DB:-dada}
      POSTGRES_USER: ${DADA_POSTGRES_USER:-dada}
      POSTGRES_PASSWORD: ${DADA_POSTGRES_PASSWORD:-dada-development-only}
    ports:
      - "${DADA_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${DADA_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
